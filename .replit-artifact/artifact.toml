kind = "web"
previewPath = "/"
title = "Nivara"
description = "A calm, intelligent student-success platform that connects academic progress, daily well-being check-ins, explainable insights, practical support, and counsellor connectivity."
version = "1.0.0"
id = "artifacts/nivara"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22844

[services.development]
run = "pnpm --filter @workspace/nivara run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/nivara", "run", "build" ]
serve = "static"
publicDir = "artifacts/nivara/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22844"
BASE_PATH = "/"
